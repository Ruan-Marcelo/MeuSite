<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Projeto de Ruan Marcelo que consome a API do GitHub para analisar usuários, repositórios, linguagens e estrelas."
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://zruanzito.com.br/consumoDeAPI.html" />
    <meta property="og:title" content="Dashboard GitHub | Ruan Marcelo" />
    <meta property="og:description" content="Aplicação web que consulta a API do GitHub e monta um dashboard de perfil." />

    <title>Dashboard GitHub | Ruan Marcelo</title>

    <link
      rel="shortcut icon"
      type="imagex/png"
      href="https://static.thenounproject.com/png/34322-200.png"
    />
    <link rel="canonical" href="https://zruanzito.com.br/consumoDeAPI.html" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
      :root {
        --bg: #000;
        --card: #0b0b0f;
        --border: #3b2451;
        --text: #e6edf3;
        --accent: #7c3aed;
        --muted: #d8c8e8;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial;
      }

      body {
        background: var(--bg);
        color: var(--text);
        padding: 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: 0.3s;
      }

      header {
        width: 100%;
        max-width: 1100px;
        display: flex;
        justify-content: space-between;
        margin-bottom: 30px;
      }

      header a {
        color: var(--text);
        text-decoration: none;
      }

      .search {
        display: flex;
        gap: 10px;
        margin-bottom: 30px;
        flex-wrap: wrap;
        justify-content: center;
      }

      input {
        padding: 12px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
      }

      button {
        padding: 12px 18px;
        background: var(--accent);
        border: none;
        border-radius: 6px;
        color: white;
        cursor: pointer;
      }

      .user {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 30px;
      }

      .user img {
        width: 80px;
        border-radius: 50%;
      }

      .dashboard {
        width: 100%;
        max-width: 1100px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }

      .card {
        background: var(--card);
        padding: 20px;
        border-radius: 8px;
        border: 1px solid var(--border);
      }

      ul {
        width: 100%;
        max-width: 1100px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 15px;
        list-style: none;
      }

      .repo {
        background: var(--card);
        padding: 20px;
        border-radius: 8px;
        border: 1px solid var(--border);
      }

      .rank {
        color: gold;
        font-size: 12px;
      }

      .info {
        display: flex;
        justify-content: space-between;
        margin: 10px 0;
        font-size: 13px;
      }

      .commit {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.5;
      }

      .commit-list {
        display: grid;
        gap: 10px;
        margin-top: 12px;
      }

      .commit-item {
        border-top: 1px solid var(--border);
        padding-top: 10px;
      }

      .commit-item strong {
        display: block;
        color: var(--text);
        font-size: 13px;
        margin-bottom: 4px;
      }

      .commit-item a {
        color: var(--accent);
        font-size: 12px;
        text-decoration: none;
      }

      canvas {
        max-width: 100%;
      }

      .erro {
        color: #ffb4b4;
        margin-bottom: 20px;
      }

      @media (max-width: 640px) {
        body {
          padding: 24px;
        }

        header {
          flex-direction: column;
          gap: 16px;
          align-items: center;
          text-align: center;
        }

        input,
        button {
          width: 100%;
        }
      }


      #heatmap {
        display: grid;
        grid-template-columns: repeat(30, 12px);
        gap: 4px;
        margin-top: 10px;
        min-height: 92px;
      }

      .day {
        width: 12px;
        height: 12px;
        background: #17121f;
        border-radius: 2px;
        border: 1px solid rgba(168, 85, 247, 0.16);
      }

      .level1 {
        background: #3b1d57;
      }
      .level2 {
        background: #5b21b6;
      }
      .level3 {
        background: #7c3aed;
      }
      .level4 {
        background: #a855f7;
      }

      .empty-state {
        color: var(--muted);
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>GitHub Dashboard</h1>

      <a href="./index.html">Voltar ao portfólio</a>
    </header>

    <div class="search d-flex flex-wrap justify-content-center">
      <input class="form-control" id="user" placeholder="Usuário GitHub" autocomplete="off" />

      <button class="btn site-btn" type="button" onclick="getApi()">Buscar</button>
    </div>

    <p id="feedback" class="erro" aria-live="polite"></p>

    <div id="userInfo" class="user d-flex align-items-center"></div>

    <div class="dashboard">
      <div class="card" id="analysis"></div>

      <div class="card">
        <h3>Developer Score</h3>

        <p id="score"></p>
      </div>

      <div class="card">
        <canvas id="langChart"></canvas>
      </div>

      <div class="card">
        <canvas id="starsChart"></canvas>
      </div>

      <div class="card">
        <h3>Heatmap de Commits</h3>

        <div id="heatmap"></div>
      </div>
    </div>

    <ul id="repos"></ul>

    <script>

      const languageColors = {
        JavaScript: "#f1e05a",
        Python: "#3572A5",
        Java: "#b07219",
        TypeScript: "#2b7489",
        HTML: "#e34c26",
        CSS: "#563d7c",
        Go: "#00ADD8",
        Rust: "#dea584",
      };

      let langChart;
      let starsChart;


      async function getApi() {
        const user = document.getElementById("user").value.trim();
        const feedback = document.getElementById("feedback");

        feedback.textContent = "";
        document.getElementById("repos").innerHTML = "";
        document.getElementById("userInfo").innerHTML = "";

        if (user === "") {
          feedback.textContent = "Digite um usuário.";
          return;
        }

        try {
          const userData = await fetch(`https://api.github.com/users/${user}`);
          const userJson = await userData.json();

          if (!userData.ok || userJson.message === "Not Found") {
            feedback.textContent = "Usuário não encontrado.";
            return;
          }

          document.getElementById("userInfo").innerHTML = `

<img src="${userJson.avatar_url}" alt="Avatar de ${userJson.login}">
<div>
<strong>${userJson.login}</strong>
<p>${userJson.public_repos} repositórios</p>
</div>
`;

          const repoData = await fetch(
            `https://api.github.com/users/${user}/repos`,
          );
          let repos = await repoData.json();

          if (!repoData.ok || !Array.isArray(repos)) {
            feedback.textContent = "Erro ao buscar repositórios.";
            return;
          }

          const events = await fetchGitHubEvents(user);
          const repoCommits = await fetchRepositoryCommits(repos);
          const commits = mergeCommits(collectEventCommits(events), repoCommits);

          repos.sort((a, b) => b.stargazers_count - a.stargazers_count);

          renderRepos(repos);

          createCharts(repos);

          analyzeProfile(repos);

          calculateScore(repos);

          renderRecentCommits(commits);

          generateHeatmap(commits);
        } catch {
          feedback.textContent = "Não foi possível consultar a API do GitHub agora.";
        }
      }

      async function fetchGitHubEvents(user) {
        try {
          const response = await fetch(
            `https://api.github.com/users/${user}/events/public?per_page=100`,
          );

          if (!response.ok) return [];

          const events = await response.json();
          return Array.isArray(events) ? events : [];
        } catch {
          return [];
        }
      }

      async function fetchRepositoryCommits(repos) {
        const since = new Date();
        since.setDate(since.getDate() - 180);

        const publicRepos = repos
          .sort((a, b) => new Date(b.pushed_at || b.updated_at) - new Date(a.pushed_at || a.updated_at))
          .slice(0, 12);

        const results = await Promise.allSettled(
          publicRepos.map(async (repo) => {
            const response = await fetch(
              `${repo.commits_url.replace("{/sha}", "")}?per_page=30&author=${repo.owner.login}&since=${since.toISOString()}`,
            );

            if (!response.ok) return [];

            const commits = await response.json();
            if (!Array.isArray(commits)) return [];

            return commits.map((item) => ({
              repo: repo.full_name,
              message: item.commit?.message || "Commit sem mensagem",
              sha: item.sha,
              url: item.html_url,
              date: item.commit?.author?.date || item.commit?.committer?.date,
            }));
          }),
        );

        return results
          .filter((result) => result.status === "fulfilled")
          .flatMap((result) => result.value)
          .filter((commit) => commit.sha && commit.date);
      }

      function collectEventCommits(events) {
        return getCommitEvents(events).flatMap((event) =>
          event.payload.commits.map((commit) => ({
            repo: event.repo.name,
            message: commit.message,
            sha: commit.sha,
            url: `https://github.com/${event.repo.name}/commit/${commit.sha}`,
            date: event.created_at,
          })),
        );
      }

      function mergeCommits(...commitGroups) {
        const commitsBySha = new Map();

        commitGroups.flat().forEach((commit) => {
          if (!commit.sha || !commit.date || commitsBySha.has(commit.sha)) return;
          commitsBySha.set(commit.sha, commit);
        });

        return [...commitsBySha.values()].sort(
          (a, b) => new Date(b.date) - new Date(a.date),
        );
      }


      function getCommitEvents(events) {
        return events.filter(
          (event) =>
            event.type === "PushEvent" &&
            Array.isArray(event.payload?.commits) &&
            event.payload.commits.length > 0,
        );
      }

      function generateHeatmap(commits = []) {
        const heatmap = document.getElementById("heatmap");

        heatmap.innerHTML = "";
        const commitsByDate = new Map();

        commits.forEach((commit) => {
          const date = new Date(commit.date).toISOString().slice(0, 10);
          const total = commitsByDate.get(date) || 0;
          commitsByDate.set(date, total + 1);
        });

        const today = new Date();
        const days = [];

        for (let i = 179; i >= 0; i--) {
          const date = new Date(today);
          date.setDate(today.getDate() - i);
          days.push(date.toISOString().slice(0, 10));
        }

        days.forEach((date) => {
          const count = commitsByDate.get(date) || 0;
          const level = Math.min(count, 4);
          const div = document.createElement("div");

          div.classList.add("day");
          div.title = `${count} commit${count === 1 ? "" : "s"} em ${date}`;

          if (level > 0) {
            div.classList.add("level" + level);
          }

          heatmap.appendChild(div);
        });
      }

      function renderRecentCommits(commits = []) {
        const analysis = document.getElementById("analysis");
        const recentCommits = commits.slice(0, 6);

        const oldList = analysis.querySelector(".commit-list");
        oldList?.remove();

        const list = document.createElement("div");
        list.className = "commit-list";

        if (!recentCommits.length) {
          list.innerHTML = '<p class="empty-state">Nenhum commit público recente encontrado.</p>';
          analysis.appendChild(list);
          return;
        }

        recentCommits.forEach((commit) => {
          const item = document.createElement("div");
          item.className = "commit-item";

          const title = document.createElement("strong");
          title.textContent = commit.message.split("\n")[0];

          const meta = document.createElement("span");
          meta.className = "commit";
          meta.textContent = `${commit.repo} - ${new Date(commit.date).toLocaleString("pt-BR", {
            dateStyle: "short",
            timeStyle: "short",
          })}`;

          item.append(title, meta);

          if (commit.url) {
            const link = document.createElement("a");
            link.href = commit.url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = `Abrir commit ${commit.sha.slice(0, 7)}`;
            item.appendChild(link);
          }

          list.appendChild(item);
        });

        analysis.appendChild(list);
      }


      function renderRepos(repos) {
        const reposContainer = document.getElementById("repos");

        const topRepos = repos.slice(0, 10);

        for (let i = 0; i < topRepos.length; i++) {
          let repo = topRepos[i];

          const li = document.createElement("li");

          li.classList.add("repo");

          li.innerHTML = `

<div class="rank">#${i + 1}</div>

<strong>${repo.name}</strong>

<div class="info">
<span>${repo.stargazers_count} stars</span>
<span>${repo.language ?? "N/A"}</span>
</div>

<div class="commit">
Atualizado em ${new Date(repo.updated_at).toLocaleDateString("pt-BR")}
</div>

<a href="${repo.html_url}" target="_blank" rel="noopener noreferrer">Abrir repositório</a>
`;

          reposContainer.appendChild(li);
        }

        gsap.from(".repo", { opacity: 0, y: 40, stagger: 0.1 });
      }


      function createCharts(repos) {
        let langs = {};
        let names = [];
        let stars = [];

        repos.slice(0, 5).forEach((repo) => {
          names.push(repo.name);

          stars.push(repo.stargazers_count);

          if (repo.language) {
            langs[repo.language] = (langs[repo.language] || 0) + 1;
          }
        });

        let colors = [];

        Object.keys(langs).forEach((lang) => {
          colors.push(languageColors[lang] || "#999");
        });

        if (langChart) langChart.destroy();
        if (starsChart) starsChart.destroy();

        langChart = new Chart(document.getElementById("langChart"), {
          type: "doughnut",

          data: {
            labels: Object.keys(langs),
            datasets: [
              {
                data: Object.values(langs),
                backgroundColor: colors,
              },
            ],
          },
        });

        starsChart = new Chart(document.getElementById("starsChart"), {
          type: "bar",

          data: {
            labels: names,
            datasets: [
              {
                label: "Stars",
                data: stars,
              },
            ],
          },
        });
      }


      function analyzeProfile(repos) {
        let stars = 0;
        let langs = {};

        repos.forEach((repo) => {
          stars += repo.stargazers_count;

          if (repo.language) {
            langs[repo.language] = (langs[repo.language] || 0) + 1;
          }
        });

        let topLang = Object.keys(langs).sort((a, b) => langs[b] - langs[a])[0];

        let summary = `Este desenvolvedor trabalha principalmente com ${topLang || "tecnologias variadas"}.
Possui ${repos.length} repositórios e ${stars} estrelas acumuladas.`;

        document.getElementById("analysis").innerHTML = `

<h3>Resumo do Perfil</h3>

<p>${summary}</p>

`;
      }


      function calculateScore(repos) {
        let score = 0;

        repos.forEach((repo) => {
          score += repo.stargazers_count * 5;
          score += repo.forks_count * 3;
        });

        document.getElementById("score").innerText = score;
      }

      document.getElementById("user").addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          getApi();
        }
      });
    </script>
  </body>
</html>
